# .typos.toml
[files]
extend-exclude = [
  "smoketest/**",
  "mibs/**"
]

# DozenOS-specific networking terms and abbreviations
[default.extend-words]
dum = "dum"      # dummy interface
oif = "oif"      # outgoing interface
iif = "iif"      # incoming interface

# OpenSSL configuration file
Widgits = "Widgits"      # organization name

# systemd daemon names
localed = "localed"      # systemd-localed(8), the locale daemon
